[package]
name = "invoice-company-app"
version = "0.1.18"
description = "Local quote and invoice app"
edition = "2021"
rust-version = "1.90"

[lib]
name = "invoice_company_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
fs2 = "0.4"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "net", "sync"] }
tempfile = "3"
base64 = "0.22"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
