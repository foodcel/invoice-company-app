<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermitage · cinq bas de document</title><style>
:root{--ink:#27332f;--muted:#6a746f;--line:#dce1dc;--green:#286c58;--soft:#edf4ee;--brown:#795747}*{box-sizing:border-box}body{margin:0;background:#f3f1eb;color:var(--ink);font:14px/1.5 'Segoe UI',Arial,sans-serif}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:9px 14px;transition:background .16s,box-shadow .16s}button:hover{box-shadow:inset 0 0 0 1px var(--green);background:var(--soft)}button:focus-visible{outline:none;box-shadow:inset 0 0 0 2px #448ad7}button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:white}header{background:#fff;border-bottom:1px solid var(--line);padding:20px 28px;display:flex;gap:20px;align-items:center;justify-content:space-between}h1{font-size:21px;margin:0;letter-spacing:-.03em}header p{margin:4px 0 0;color:var(--muted);font-size:12px}.types{display:flex;gap:6px}nav{display:flex;gap:7px;flex-wrap:wrap;padding:18px 28px 0}nav button{font-size:13px}main{max-width:1220px;margin:20px auto;padding:0 28px 26px;display:grid;grid-template-columns:minmax(0,840px) 250px;gap:24px;align-items:start}.paper{background:white;min-height:460px;border:1px solid #e1e2db;box-shadow:0 9px 27px #273c2810;padding:34px 35px 24px;border-radius:4px}.work-end{color:var(--muted);font-size:11px;margin-bottom:38px;display:flex;align-items:center;gap:14px}.work-end:before,.work-end:after{content:'';height:1px;flex:1;background:var(--line)}.document-footer{min-height:290px;display:flex;flex-direction:column;justify-content:flex-end}.tax-ids{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:22px;padding-top:12px;color:var(--muted);font-size:10px;gap:12px;flex-wrap:wrap}.eyebrow{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:750;color:var(--brown);margin:0 0 10px}.note{font-size:12px;margin:0;color:var(--muted);line-height:1.6}.payment-list{display:grid;gap:10px}.payment{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:12px;white-space:nowrap}.payment span:first-child{color:var(--muted)}.money{font-variant-numeric:tabular-nums;white-space:nowrap}.finance{display:grid;gap:9px;font-size:12px}.f-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.f-row span:first-child{color:var(--muted)}.f-total{border-top:1px solid var(--brown);padding-top:11px;font-weight:750;font-size:15px;margin-top:3px}.f-total span:first-child{color:var(--ink)}.balance{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border-radius:8px;padding:13px 15px;font-weight:700;color:var(--green)}.balance strong{font-size:22px;letter-spacing:-.035em}.split{display:grid;grid-template-columns:1fr 1.12fr;gap:24px}.card{border:1px solid var(--line);border-radius:10px;padding:18px}.notes-payments{display:flex;flex-direction:column;gap:22px}.notes-payments .payment-list{padding-top:0}.v1 .finance .balance{margin-top:5px}.v1 .card:first-child{background:#fcfdfb}.v2 .note-bar{padding:0 0 15px;border-bottom:1px solid var(--line);margin-bottom:14px}.v2 .ledger{display:grid;grid-template-columns:1fr 1fr;gap:26px}.v2 .ledger h3{margin-top:0}.v2 .balance{margin-top:20px;border-radius:0 0 8px 8px;background:var(--green);color:white;padding:17px 20px}.v2 .total-received{border-top:1px solid var(--line);padding-top:10px;margin-top:12px;font-size:12px}.v3 .timeline{border-left:2px solid #d6e4d9;margin-left:4px;padding-left:18px;display:grid;gap:17px}.v3 .timeline .payment{position:relative}.v3 .timeline .payment:before{content:'';position:absolute;left:-24px;width:9px;height:9px;background:var(--green);border:2px solid white;border-radius:50%}.v3 .balance{flex-direction:column;align-items:flex-start;margin-bottom:18px;padding:20px;background:var(--green);color:white}.v3 .balance strong{font-size:30px}.v3 .note-box{background:#f7f4ee;border-radius:8px;padding:15px;margin-top:23px}.v4 .receipt-summary{display:grid;grid-template-columns:1fr 26px 1fr 26px 1fr;align-items:center;gap:8px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:20px 0}.v4 .receipt-summary .figure{display:flex;flex-direction:column;gap:5px}.v4 .figure strong{font-size:20px;letter-spacing:-.03em}.v4 .figure span{font-size:11px;color:var(--muted)}.v4 .figure:last-child{color:var(--green)}.v4 .op{font-size:23px;color:#93a097;text-align:center}.v4 .taxes{display:flex;gap:20px;font-size:11px;justify-content:flex-end}.v4 .taxes span{white-space:nowrap}.v4 .payments-inline{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.v4 .payments-inline .payment{flex-direction:column;align-items:flex-start;border-left:2px solid #b8cfbd;padding-left:12px;gap:3px}.v5 .overview{display:grid;grid-template-columns:.85fr 1.1fr 1.15fr;gap:17px}.v5 .overview>div+div{border-left:1px solid var(--line);padding-left:17px}.v5 .finance{gap:7px;font-size:11px}.v5 .payment{font-size:11px;gap:8px}.v5 .f-total{font-size:13px}.v5 .balance{margin-top:22px;border-radius:7px;min-height:62px}.v5 .balance p{font-size:11px;margin:0;color:var(--muted);font-weight:400}.v5 .balance strong{font-size:25px}.rationale{padding:10px 0}.rationale .index{color:var(--green);font-size:34px;font-weight:750;letter-spacing:-.05em}.rationale h2{font-size:21px;line-height:1.2;margin:6px 0 12px;letter-spacing:-.025em}.rationale p{color:var(--muted);font-size:13px}.rationale .why{color:var(--ink)}.tag{display:inline-block;font-size:11px;background:#e7efe7;color:var(--green);padding:4px 8px;border-radius:5px}.review-foot{font-size:11px;margin-top:25px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted)}@media(max-width:950px){main{grid-template-columns:1fr}.rationale{order:-1}.rationale .index{font-size:22px}.rationale h2{display:inline-block;margin:0 12px}.rationale p{margin:8px 0}.review-foot{display:none}}@media(max-width:650px){header{align-items:flex-start;flex-direction:column;padding:16px}nav{padding:14px 16px 0}main{padding:0 16px}.paper{padding:22px 17px}.split,.v2 .ledger,.v5 .overview{grid-template-columns:1fr}.v5 .overview>div+div{border-left:0;border-top:1px solid var(--line);padding:15px 0 0}.v4 .figure strong{font-size:16px}.v4 .taxes{flex-wrap:wrap;gap:7px}.v4 .payments-inline{grid-template-columns:1fr}.document-footer{min-height:0}}
</style></head><body><header><div><h1>Un bas de document plus clair</h1><p>Cinq propositions · mêmes chiffres, mêmes dates · choisissez la composition.</p></div><div class="types"><button data-kind="facture" aria-pressed="true">Facture</button><button data-kind="soumission" aria-pressed="false">Soumission</button></div></header><nav aria-label="Propositions"><button data-layout="1" aria-pressed="true">01 · Deux panneaux</button><button data-layout="2" aria-pressed="false">02 · Relevé clair</button><button data-layout="3" aria-pressed="false">03 · Historique</button><button data-layout="4" aria-pressed="false">04 · Calcul lisible</button><button data-layout="5" aria-pressed="false">05 · Vue d’ensemble</button></nav><main><article class="paper"><div class="work-end">Fin des travaux et articles</div><div id="footer" class="document-footer"></div><div class="tax-ids"><span>TPS 848045563 RT0001</span><span>TVQ 1212260726 TQ0001</span></div></article><aside class="rationale"><span class="index" id="index">01</span><h2 id="title"></h2><span class="tag" id="tag"></span><p class="why" id="why"></p><p id="tradeoff"></p><p class="review-foot">Maquettes de présentation. Ces styles ne remplacent pas encore le document de l’application.</p></aside></main><script>
let kind='facture',layout=Number(new URLSearchParams(location.search).get('layout'))||1;
const choices=[
['Deux panneaux','Équilibré','Les notes et paiements sont regroupés dans un panneau. Le calcul reste dans un autre. La balance ressort sans prendre toute la place.','Proche du document actuel, avec un découpage plus évident. Les cadres donnent un peu plus de présence au bas de la page.'],
['Un relevé clair','Lecture directe','Un historique à gauche, un calcul à droite, puis une seule bande de balance sur toute la largeur : le client voit immédiatement le montant restant.','La note tient une ligne dédiée en haut. La bande de balance fait de ce montant la conclusion du document.'],
['L’historique d’abord','Paiements visibles','Les versements forment une petite chronologie. La balance s’affiche dans une carte distincte, avec le détail des taxes en dessous.','Bon choix si les clients versent plusieurs acomptes. Le bloc de balance est volontairement plus présent que le total avec taxes.'],
['Un calcul qui se comprend','Total − reçu = balance','Le total avec taxes, le total reçu et la balance sont disposés comme une opération. Les dates des versements se lisent ensuite dans trois petites colonnes.','Plus graphique et moins comptable. Les taux de taxes restent visibles, mais passent au second plan.'],
['Tout en un coup d’œil','Compact','Trois colonnes séparées : note, paiements, détail des montants. Une bande de balance calme referme l’ensemble.','Utilise bien la largeur et réduit la hauteur. Les longues notes ou nombreuses dates auront besoin de plus d’espace.']];
const note=()=>'<h3 class="eyebrow">Note pour le client</h3><p class="note">Entente de paiement.</p>';
const payHeading=()=>kind==='facture'?'Paiements reçus':'Dépôts demandés';
const received=()=>kind==='facture'?'Total reçu':'Total des dépôts';
const payRows=()=>[['16/09/2026','5 000,00 $'],['22/09/2026','2 100,00 $'],['29/09/2026','4 900,00 $']].map(([date,amount])=>`<div class="payment"><span>${date}</span><strong class="money">${amount}</strong></div>`).join('');
const taxes=()=>'<div class="f-row"><span>Sous-total</span><span class="money">21 050,00 $</span></div><div class="f-row"><span>TPS (5 %)</span><span class="money">1 052,50 $</span></div><div class="f-row"><span>TVQ (9,975 %)</span><span class="money">2 099,74 $</span></div><div class="f-row f-total"><span>Total avec taxes</span><span class="money">24 202,24 $</span></div>';
const receivedRow=()=>`<div class="f-row"><span>${received()}</span><span class="money">12 000,00 $</span></div>`;
const balance=()=>'<div class="balance"><span>Balance</span><strong class="money">12 202,24 $</strong></div>';
function render(){
 const views=[
 `<div class="split v1"><div class="card notes-payments"><div>${note()}</div><div><h3 class="eyebrow">${payHeading()}</h3><div class="payment-list">${payRows()}</div></div></div><div class="card finance">${taxes()}${receivedRow()}${balance()}</div></div>`,
 `<div class="v2"><div class="note-bar">${note()}</div><div class="ledger"><div><h3 class="eyebrow">${payHeading()}</h3><div class="payment-list">${payRows()}</div><div class="total-received">${receivedRow()}</div></div><div class="finance">${taxes()}</div></div>${balance()}</div>`,
 `<div class="split v3"><div><h3 class="eyebrow">${payHeading()}</h3><div class="timeline">${payRows()}</div><div class="note-box">${note()}</div></div><div>${balance()}<div class="finance">${taxes()}${receivedRow()}</div></div></div>`,
 `<div class="v4">${note()}<div class="receipt-summary"><div class="figure"><span>Total avec taxes</span><strong class="money">24 202,24 $</strong></div><span class="op">−</span><div class="figure"><span>${received()}</span><strong class="money">12 000,00 $</strong></div><span class="op">=</span><div class="figure"><span>Balance</span><strong class="money">12 202,24 $</strong></div></div><div class="taxes"><span>Sous-total : 21 050,00 $</span><span>TPS (5 %) : 1 052,50 $</span><span>TVQ (9,975 %) : 2 099,74 $</span></div><h3 class="eyebrow" style="margin-top:24px">${payHeading()}</h3><div class="payments-inline">${payRows()}</div></div>`,
 `<div class="v5"><div class="overview"><div>${note()}</div><div><h3 class="eyebrow">${payHeading()}</h3><div class="payment-list">${payRows()}</div><div style="margin-top:12px;font-size:11px">${receivedRow()}</div></div><div><h3 class="eyebrow">Montants</h3><div class="finance">${taxes()}</div></div></div><div class="balance"><div><span>Balance</span><p>${kind==='facture'?'Après les paiements reçus':'Après les dépôts indiqués'}</p></div><strong class="money">12 202,24 $</strong></div></div>`
 ];
 document.querySelector('#footer').innerHTML=views[layout-1];
 const choice=choices[layout-1];['title','tag','why','tradeoff'].forEach((id,i)=>document.getElementById(id).textContent=choice[i]);
 document.getElementById('index').textContent=String(layout).padStart(2,'0');
 document.querySelectorAll('[data-layout]').forEach(button=>button.setAttribute('aria-pressed',Number(button.dataset.layout)===layout));
 document.querySelectorAll('[data-kind]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.kind===kind));
 history.replaceState(null,'',`?layout=${layout}&kind=${kind}`);
}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.layout)layout=Number(button.dataset.layout);if(button.dataset.kind)kind=button.dataset.kind;render()});
kind=new URLSearchParams(location.search).get('kind')==='soumission'?'soumission':'facture';render();
</script></body></html>
